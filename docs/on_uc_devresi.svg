<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>BCT 22 analog ön uç: şönt, RC filtre ve kelepçe</title>
  <rect width="780" height="420" fill="#ffffff"/>

  <!-- Sensor -->
  <rect x="30" y="140" width="120" height="110" rx="6" fill="#FAECE7" stroke="#222" stroke-width="1.5"/>
  <text x="90" y="190" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">BCT 22</text>
  <text x="90" y="210" font-size="13" text-anchor="middle" fill="#444">4-20 mA</text>
  <text x="140" y="165" font-size="14" text-anchor="end" fill="#222">+</text>
  <text x="140" y="235" font-size="14" text-anchor="end" fill="#222">−</text>

  <g stroke="#222" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Besleme ve PTC -->
    <path d="M150 160 L200 160 L200 80 L220 80"/>
    <rect x="220" y="72" width="50" height="16"/>
    <path d="M270 80 L330 80"/>

    <!-- Sinyal hatti -->
    <path d="M150 230 L260 230"/>

    <!-- Sont -->
    <path d="M260 230 L260 262"/>
    <rect x="252" y="262" width="16" height="50"/>
    <path d="M260 312 L260 340"/>

    <!-- Seri direnc -->
    <path d="M260 230 L330 230"/>
    <rect x="330" y="222" width="60" height="16"/>
    <path d="M390 230 L560 230"/>

    <!-- Kondansator -->
    <path d="M450 230 L450 276"/>
    <path d="M428 276 L472 276" stroke-width="2.5"/>
    <path d="M428 286 L472 286" stroke-width="2.5"/>
    <path d="M450 286 L450 340"/>

    <!-- Kelepce: D2 (VDDA'ya), D1 (AGND'den) -->
    <path d="M560 230 L560 196"/>
    <path d="M548 178 L572 178"/>
    <path d="M560 178 L560 130"/>
    <path d="M545 130 L575 130"/>
    <path d="M560 230 L560 262"/>
    <path d="M548 262 L572 262"/>
    <path d="M560 280 L560 340"/>

    <!-- ADC pinine -->
    <path d="M560 230 L650 230"/>

    <!-- AGND -->
    <path d="M250 340 L570 340"/>
    <path d="M410 340 L410 352"/>
    <path d="M396 352 L424 352"/>
    <path d="M401 358 L419 358"/>
    <path d="M406 364 L414 364"/>
  </g>

  <!-- Diyot gövdeleri -->
  <polygon points="548,196 572,196 560,178" fill="#222"/>
  <polygon points="548,280 572,280 560,262" fill="#222"/>

  <!-- Akim yonu -->
  <polygon points="226,225 236,230 226,235" fill="#222"/>

  <!-- Dugum noktalari -->
  <circle cx="260" cy="230" r="3.5" fill="#222"/>
  <circle cx="450" cy="230" r="3.5" fill="#222"/>
  <circle cx="560" cy="230" r="3.5" fill="#222"/>

  <!-- MCU -->
  <rect x="650" y="185" width="110" height="90" rx="6" fill="#EEEDFE" stroke="#222" stroke-width="1.5"/>
  <text x="705" y="224" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">STM32F4</text>
  <text x="705" y="246" font-size="12" text-anchor="middle" fill="#444">PA1 · ADC1_IN1</text>

  <!-- Etiketler -->
  <text x="245" y="64" font-size="13" text-anchor="middle" fill="#222">PTC</text>
  <text x="338" y="85" font-size="13" fill="#222">+V (12-32 V)</text>
  <text x="200" y="216" font-size="12" text-anchor="middle" fill="#444">I = 4-20 mA</text>
  <text x="276" y="282" font-size="13" fill="#222">R şönt</text>
  <text x="276" y="298" font-size="13" fill="#222">150 Ω</text>
  <text x="360" y="212" font-size="13" text-anchor="middle" fill="#222">R seri 1 kΩ</text>
  <text x="480" y="277" font-size="13" fill="#222">C</text>
  <text x="480" y="293" font-size="13" fill="#222">100 nF</text>
  <text x="560" y="118" font-size="13" text-anchor="middle" fill="#222">VDDA (3.3 V)</text>
  <text x="580" y="192" font-size="13" fill="#222">D2</text>
  <text x="580" y="276" font-size="13" fill="#222">D1</text>
  <text x="580" y="298" font-size="12" fill="#444">BAT54S</text>
  <text x="432" y="362" font-size="13" fill="#222">AGND</text>

  <text x="390" y="400" font-size="13" text-anchor="middle" fill="#444">f_c = 1 / (2π · (150 Ω + 1 kΩ) · 100 nF) ≈ 1.4 kHz</text>
</svg>
